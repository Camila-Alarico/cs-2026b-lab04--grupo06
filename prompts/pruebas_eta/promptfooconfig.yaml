description: "E4: generación de pruebas pytest para los algoritmos ETA de RutaSIT Arequipa"
prompts:
  - id: file://v1.txt
    label: v1
  - id: file://v2.txt
    label: v2
  - id: file://v3.txt
    label: v3
providers:
  - id: file://../proveedor_grabado.py
    label: asistente-grabado
    config:
      carpeta: pruebas_eta
defaultTest:
  assert:
    # A1: contrato JSON propio de la Tarea B.
    - type: is-json
      value: file://esquema.json
      metric: A1_contrato_json
    # A2 (aserción clave sugerida por la guía): al menos tres assert y una función pytest.
    - type: javascript
      metric: A2_tres_assert_y_pytest
      value: |
        try {
          const r = JSON.parse(output);
          const codigo = r.codigo || '';
          const cantidad = (codigo.match(/^\s*assert\s+/gm) || []).length;
          return cantidad >= 3 && /^\s*def\s+test_[A-Za-z0-9_]+\s*\(/m.test(codigo);
        } catch (e) { return false; }
    # A3: utiliza las clases y el módulo reales del repositorio.
    - type: javascript
      metric: A3_importa_codigo_real
      value: |
        try {
          const codigo = JSON.parse(output).codigo || '';
          return /from\s+rutasit\.algoritmos_eta\s+import/.test(codigo) &&
            /(DistanciaDirecta|VelocidadPromedio)/.test(codigo) &&
            /\.segundos\s*\(/.test(codigo);
        } catch (e) { return false; }
    # A4: las pruebas siguen el estilo pytest y no son solo asserts ejecutados al importar.
    - type: javascript
      metric: A4_estilo_pytest
      value: |
        try {
          const codigo = JSON.parse(output).codigo || '';
          return /def\s+test_/.test(codigo) && !/unittest\.TestCase/.test(codigo);
        } catch (e) { return false; }
    # A5: respuesta estructurada sin bloques Markdown ni texto fuera del JSON (is-json también lo valida).
    - type: javascript
      metric: A5_sin_markdown_externo
      value: |
        const t = output.trim();
        return t.startsWith('{') && t.endsWith('}') && !t.includes('```');
tests: file://casos.yaml
