name: fitness-functions
on: [pull_request, push]
jobs:
  arquitectura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install import-linter pytest matplotlib
      - run: lint-imports           # FF-01 a FF-03
        env: { PYTHONPATH: src }
      - run: python -m pytest -v tests   # incluye FF-04 a FF-07